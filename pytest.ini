# pytest settings
#
# filterwarnings: SpeechRecognition (in ~/.config/OSC-DreamChatbox/extras)
# pulls in standard-aifc on Python 3.13+, and that package warns on
# import that it is not the stdlib aifc. Nothing here can fix that -
# even SpeechRecognition 3.17 still depends on it - and it says nothing
# about this project, so it stays out of the test output. Only this one
# message is hidden; every other warning still shows up.
[pytest]
testpaths = tests
filterwarnings =
    ignore:aifc was removed in Python 3\.13:DeprecationWarning
    # same kind of thing on Python 3.12: the stdlib announces its own
    # removal. core/audiolevel.py already falls back to audioop-lts.
    ignore:'audioop' is deprecated:DeprecationWarning
